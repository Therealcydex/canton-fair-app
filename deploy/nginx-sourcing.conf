# nginx site of the Sourcing app (deploy/README.md). server-setup.sh copies it to
# /etc/nginx/sites-available/sourcing, replacing __HOST__ with the address (76-13-55-161.sslip.io).
# certbot then adds the https part (certificate, port 443, redirect from http).
#
#   https://__HOST__/          web app (frontend/build)
#   https://__HOST__/m/        mobile app, installable on iPhone (mobile/dist)
#   https://__HOST__/api/      backend (Node, PM2, 127.0.0.1:3000)
#   https://__HOST__/uploads/  product photos and older QR photos (backend/uploads)

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # Up to 10 photos of 8 MB in one request (backend/utils/upload.js).
    client_max_body_size 90m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Served straight from disk; the names are random (D17), never listed.
    location /uploads/ {
        alias /opt/sourcing/backend/uploads/;
        autoindex off;
        expires 30d;
    }

    # Mobile app. The service worker and the HTML must never be cached by the browser, so a new
    # version reaches the phones; the built files have a hash in their name.
    location = /m {
        return 301 /m/;
    }
    location /m/ {
        root /opt/sourcing;            # /m/x -> /opt/sourcing/m/x (no alias: nested locations stay simple)
        try_files $uri $uri/ /m/index.html;
        location ~ (sw\.js|index\.html|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache" always;
        }
        location /m/assets/ {
            expires 1y;
        }
    }

    # Web app (React Router: every path is the same page).
    location / {
        root /opt/sourcing/web;
        try_files $uri /index.html;
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
        location /static/ {
            expires 1y;
        }
    }
}
